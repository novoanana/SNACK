<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNACK · Pedido al Economato</title>
<style>
:root{--bg:#f3f6fb;--card:#fff;--text:#172033;--muted:#6b7890;--line:#dfe5ee;--accent:#315bea;--accent2:#2449c8;--ok:#16834b;--danger:#c93636;--shadow:0 8px 28px rgba(25,40,70,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--text)}
.wrap{max-width:1180px;margin:auto;padding:24px}header{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:20px}
.brand{display:flex;align-items:center;gap:14px}.logo{width:52px;height:52px;border-radius:16px;background:var(--accent);color:#fff;display:grid;place-items:center;font-weight:800;font-size:23px}
h1{margin:0;font-size:26px}.sub{margin:3px 0 0;color:var(--muted)}.status{padding:9px 13px;border-radius:999px;background:#fff;border:1px solid var(--line);font-size:13px;color:var(--muted)}.status.ok{color:var(--ok)}.status.err{color:var(--danger)}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow)}
.card-head{padding:18px 20px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:center;justify-content:space-between}.card-head h2{font-size:18px;margin:0}
.tools{padding:14px 20px;display:flex;gap:10px;border-bottom:1px solid var(--line)}input{width:100%;padding:12px 14px;border:1px solid #cfd7e4;border-radius:11px;font-size:15px;outline:none}input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(49,91,234,.10)}
.catalog{padding:8px 12px;max-height:650px;overflow:auto}.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;padding:13px 8px;border-bottom:1px solid #edf0f5}.item:last-child{border-bottom:0}
.ref{font-weight:700;font-size:15px}.meta{font-size:12px;color:var(--muted);margin-top:3px}.add{border:0;background:#edf2ff;color:var(--accent);font-weight:700;border-radius:10px;padding:9px 13px;cursor:pointer}.add:hover{background:#dfe7ff}
.summary{padding:18px 20px}.empty{padding:30px 10px;text-align:center;color:var(--muted)}.order-row{padding:12px 0;border-bottom:1px solid var(--line)}.order-top{display:flex;justify-content:space-between;gap:10px;font-weight:700}.order-meta{display:flex;align-items:center;gap:8px;margin-top:8px}.qty{width:70px;padding:8px 9px}.remove{border:0;background:none;color:var(--danger);cursor:pointer;font-size:13px}
.total{display:flex;justify-content:space-between;font-weight:800;font-size:17px;padding:18px 0}button.primary{width:100%;border:0;background:var(--accent);color:#fff;padding:14px;border-radius:12px;font-size:16px;font-weight:800;cursor:pointer}button.primary:hover{background:var(--accent2)}button.primary:disabled{opacity:.55;cursor:not-allowed}
.notice{display:none;margin:0 20px 18px;padding:12px 13px;border-radius:11px;font-size:13px;line-height:1.4}.notice.show{display:block}.notice.ok{background:#e9f7ef;color:#126b3d}.notice.err{background:#fdecec;color:#9e2525}.loading{text-align:center;color:var(--muted);padding:40px}
@media(max-width:850px){.grid{grid-template-columns:1fr}.catalog{max-height:none}.wrap{padding:14px}header{align-items:flex-start;flex-direction:column}.status{align-self:stretch;text-align:center}}
</style>
</head>
<body>
<div class="wrap">
<header><div class="brand"><div class="logo">S</div><div><h1>SNACK</h1><p class="sub">Pedido al Economato</p></div></div><div id="status" class="status">Conectando con Economato…</div></header>
<div class="grid">
<section class="card">
<div class="card-head"><h2>Artículos disponibles</h2><span id="count" class="sub">—</span></div>
<div class="tools"><input id="search" type="search" placeholder="Buscar artículo o referencia…"></div>
<div id="catalog" class="catalog"><div class="loading">Cargando catálogo de SNACK…</div></div>
</section>
<aside class="card">
<div class="card-head"><h2>Mi pedido</h2><span id="lineCount" class="sub">0 líneas</span></div>
<div id="notice" class="notice"></div>
<div id="order" class="summary"><div class="empty">Todavía no has añadido ningún artículo.</div></div>
<div class="summary" style="padding-top:0"><div class="total"><span>Total solicitado</span><span id="total">0</span></div><button id="send" class="primary" disabled>ENVIAR PEDIDO</button></div>
</aside>
</div>
</div>

<script>
const API_URL='https://script.google.com/macros/s/AKfycbxn3r8myJMkDQ3mxbH0xlrPHkY36RQyy1kfwGe0Jp7iodznHti_5Xy2C70nMjBzpAI/exec';
const DEPARTAMENTO='SNACK LA MAREA';
let catalog=[],pedido=new Map();
const $=id=>document.getElementById(id);

function setStatus(text,type=''){$('status').textContent=text;$('status').className='status '+type}
function showNotice(text,type){const n=$('notice');n.textContent=text;n.className='notice show '+type}
async function requestJSON(url,options){
 const r=await fetch(url,options),text=await r.text();let data;
 try{data=JSON.parse(text)}catch(e){throw new Error('El backend no devolvió JSON válido.')}
 if(data&&data.ok===false)throw new Error(data.error||data.mensaje||'El backend ha rechazado la operación.');
 return data;
}
async function cargarCatalogo(){
 const cuerpos=[
  {action:'obtenerCatalogoDepartamento',departamento:DEPARTAMENTO},
  {action:'catalogoDepartamento',departamento:DEPARTAMENTO},
  {action:'catalogo',departamento:DEPARTAMENTO}
 ];
 let ultimoError=null;
 for(const body of cuerpos){
  try{
   const data=await requestJSON(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});
   const lista=data.catalogo||data.articulos||data.items||data.lineas||[];
   if(Array.isArray(lista)){
    catalog=lista.map(x=>({claveArticulo:String(x.claveArticulo??x.CLAVE_ARTICULO??''),idArticulo:String(x.idArticulo??x.ID_ARTICULO??''),referencia:String(x.referencia??x.REFERENCIA??''),categoria:String(x.categoria??x.CATEGORIA??''),departamento:String(x.departamento??x.DEPARTAMENTO??DEPARTAMENTO)})).filter(x=>x.claveArticulo&&x.referencia);
    if(catalog.length||data.ok){renderCatalog();setStatus('Conectado · SNACK','ok');return}
   }
   ultimoError=new Error('Respuesta de catálogo no reconocida.');
  }catch(e){ultimoError=e}
 }
 setStatus('Error de conexión','err');
 $('catalog').innerHTML='<div class="loading">No se pudo cargar el catálogo.<br><small>'+escapeHtml(ultimoError?ultimoError.message:'')+'</small></div>';
}
function renderCatalog(){
 const q=$('search').value.trim().toUpperCase();
 const list=catalog.filter(x=>x.referencia.toUpperCase().includes(q)||x.idArticulo.toUpperCase().includes(q)||x.claveArticulo.toUpperCase().includes(q));
 $('count').textContent=list.length+' artículos';
 $('catalog').innerHTML=list.length?list.map(x=>'<div class="item"><div><div class="ref">'+escapeHtml(x.referencia)+'</div><div class="meta">ID '+escapeHtml(x.idArticulo)+' · '+escapeHtml(x.categoria)+'</div></div><button class="add" onclick="addItem(\''+js(x.claveArticulo)+'\')">AÑADIR</button></div>').join(''):'<div class="loading">No hay artículos que coincidan.</div>';
}
function addItem(clave){const item=catalog.find(x=>x.claveArticulo===clave);if(!item)return;if(!pedido.has(clave))pedido.set(clave,{...item,cantidad:1});else pedido.get(clave).cantidad++;renderOrder()}
function changeQty(clave,value){const n=Math.max(1,parseInt(value,10)||1);if(pedido.has(clave))pedido.get(clave).cantidad=n;renderOrder()}
function removeItem(clave){pedido.delete(clave);renderOrder()}
function renderOrder(){
 const items=[...pedido.values()],total=items.reduce((s,x)=>s+x.cantidad,0);
 $('lineCount').textContent=items.length+(items.length===1?' línea':' líneas');$('total').textContent=total;$('send').disabled=items.length===0;
 if(!items.length){$('order').innerHTML='<div class="empty">Todavía no has añadido ningún artículo.</div>';return}
 $('order').innerHTML=items.map(x=>'<div class="order-row"><div class="order-top"><span>'+escapeHtml(x.referencia)+'</span><button class="remove" onclick="removeItem(\''+js(x.claveArticulo)+'\')">Eliminar</button></div><div class="order-meta"><span style="font-size:12px;color:var(--muted)">Cantidad</span><input class="qty" type="number" min="1" value="'+x.cantidad+'" onchange="changeQty(\''+js(x.claveArticulo)+'\',this.value)"></div></div>').join('');
}
async function enviarPedido(){
 const items=[...pedido.values()];if(!items.length)return;
 $('send').disabled=true;$('send').textContent='ENVIANDO…';$('notice').className='notice';
 const payload={action:'registrarPedidoWeb',pedido:{departamento:DEPARTAMENTO,lineas:items.map(x=>({claveArticulo:x.claveArticulo,cantidad:x.cantidad}))}};
 try{
  const data=await requestJSON(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(payload)});
  const r=data.resultado||data;if(!r.ok)throw new Error(r.error||r.mensaje||'No se pudo registrar el pedido.');
  showNotice('Pedido enviado correctamente. Nº de pedido: '+(r.pedidoId||'—')+'. Total solicitado: '+(r.totalSolicitado??items.reduce((s,x)=>s+x.cantidad,0))+'.','ok');
  pedido.clear();renderOrder();$('send').textContent='PEDIDO ENVIADO';
 }catch(e){showNotice('No se pudo enviar el pedido: '+e.message,'err');$('send').disabled=false;$('send').textContent='ENVIAR PEDIDO'}
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function js(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'")}
$('search').addEventListener('input',renderCatalog);$('send').addEventListener('click',enviarPedido);cargarCatalogo();
</script>
</body>
</html>
