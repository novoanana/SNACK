<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SNACK · Pedido al Economato</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;background:#f4f7fb;color:#1f2937}
.wrap{max-width:1450px;margin:0 auto;padding:28px}
header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:24px}
.brand{display:flex;align-items:center;gap:16px}
.logo{width:62px;height:62px;border-radius:18px;background:#315bea;color:white;display:grid;place-items:center;font-size:32px;font-weight:800}
h1{margin:0;font-size:30px}.subtitle{margin-top:4px;color:#718096;font-size:20px}
.status{padding:12px 18px;border-radius:24px;background:#fff;color:#718096;border:1px solid #dce3ef;font-weight:600}
.status.ok{color:#16834b}.status.error{color:#d93025}
.grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(360px,1fr);gap:24px}
.card{background:white;border:1px solid #dce3ef;border-radius:20px;overflow:hidden;box-shadow:0 2px 8px rgba(30,50,80,.04)}
.card-head{padding:24px;border-bottom:1px solid #e5eaf2;display:flex;justify-content:space-between;align-items:center}
.card-head h2{margin:0;font-size:24px}.search{padding:18px 24px;border-bottom:1px solid #e5eaf2}
input,textarea{width:100%;border:1px solid #cfd8e6;border-radius:12px;font:inherit;outline:none}
input{padding:14px 16px;font-size:17px}textarea{padding:10px 12px;resize:vertical;min-height:54px}
input:focus,textarea:focus{border-color:#315bea;box-shadow:0 0 0 3px rgba(49,91,234,.10)}
.catalog{padding:0 24px 24px;max-height:65vh;overflow:auto}
.item{display:grid;grid-template-columns:1fr 110px;gap:18px;padding:18px 0;border-bottom:1px solid #edf0f5;align-items:center}
.item-name{font-weight:700;font-size:17px}.item-meta{color:#7b8798;margin-top:5px;font-size:14px}
.qty{display:flex;align-items:center;justify-content:flex-end;gap:7px}
.qty button{width:34px;height:34px;border:1px solid #cfd8e6;border-radius:9px;background:white;cursor:pointer;font-size:20px}
.qty input{width:48px;padding:8px 4px;text-align:center;font-weight:700}
.order{padding:24px}.empty{color:#718096;text-align:center;padding:55px 15px}
.order-line{border-bottom:1px solid #edf0f5;padding:14px 0 18px}
.order-line-top{display:flex;justify-content:space-between;gap:12px;font-weight:700}
.order-line-meta{color:#718096;font-size:14px;margin-top:4px}
.comment-label{display:block;color:#718096;font-size:13px;margin:10px 0 5px}
.summary{margin-top:20px;display:flex;justify-content:space-between;font-size:21px;font-weight:800}
.send{width:100%;margin-top:18px;border:0;border-radius:14px;padding:17px;background:#315bea;color:white;font-size:18px;font-weight:800;cursor:pointer}
.send:disabled{opacity:.5;cursor:not-allowed}
.notice{margin-top:14px;padding:12px;border-radius:10px;display:none;font-size:14px}
.notice.show{display:block}.notice.ok{background:#e9f8ef;color:#167545}.notice.error{background:#fff0ef;color:#b42318}
.history{margin-top:24px}.history-body{padding:0 24px 24px}.history-row{padding:16px 0;border-bottom:1px solid #edf0f5}
.history-top{display:flex;justify-content:space-between;gap:12px;font-weight:800}.history-meta{color:#718096;font-size:14px;margin-top:5px}
.badge{padding:6px 10px;border-radius:999px;font-size:12px;font-weight:800}
.badge.pending{background:#fff6df;color:#9a6700}.badge.validated{background:#e9f8ef;color:#167545}
.history-detail{margin-top:12px;padding:12px;border-radius:12px;background:#f7f9fc;display:none}
.history-detail.show{display:block}.detail-line{padding:8px 0;border-bottom:1px solid #e4e9f0}
.detail-line:last-child{border-bottom:0}.detail-line strong{display:block}
.refresh{border:1px solid #cfd8e6;background:white;border-radius:10px;padding:8px 12px;font-weight:700;cursor:pointer}
@media(max-width:900px){.grid{grid-template-columns:1fr}.catalog{max-height:none}}
</style>
</head>
<body>
<div class="wrap">
<header>
<div class="brand"><div class="logo">S</div><div><h1>SNACK</h1><div class="subtitle">Pedido al Economato</div></div></div>
<div id="status" class="status">Conectando...</div>
</header>

<div class="grid">
<section class="card">
<div class="card-head"><h2>Artículos disponibles</h2><span id="count">0 artículos</span></div>
<div class="search"><input id="search" type="search" placeholder="Buscar artículo o referencia..." autocomplete="off"></div>
<div id="catalog" class="catalog"><div class="empty">Cargando catálogo...</div></div>
</section>

<aside class="card">
<div class="card-head"><h2>Mi pedido</h2><span id="lines">0 líneas</span></div>
<div id="order" class="order"><div class="empty">Todavía no has añadido ningún artículo.</div></div>
<div class="order">
<div class="summary"><span>Total solicitado</span><span id="total">0</span></div>
<button id="send" class="send" disabled>ENVIAR PEDIDO</button>
<div id="notice" class="notice"></div>
</div>
</aside>
</div>

<section class="card history">
<div class="card-head">
<h2>Mis pedidos</h2>
<button id="refreshOrders" class="refresh" type="button">ACTUALIZAR</button>
</div>
<div id="historyBody" class="history-body">
<div class="empty">Cargando pedidos...</div>
</div>
</section>
</div>

<script>
const API_URL='https://script.google.com/macros/s/AKfycbxn3r8myJMkDQ3mxbH0xlrPHkY36RQyy1kfwGe0Jp7iodznHti_5Xy2C70nMjBzpAI/exec';
const DEPARTAMENTO='SNACK LA MAREA';

let catalogo=[];
const pedido=new Map();
let pedidosSnack=[];
const $=id=>document.getElementById(id);

function setStatus(text,type=''){ $('status').textContent=text; $('status').className='status '+type; }

async function api(body){
 const response=await fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(body)});
 const data=await response.json();
 if(!data.ok) throw new Error(data.error||'Error del servidor.');
 return data;
}

async function cargarCatalogo(){
 try{
  setStatus('Cargando catálogo...');
  const data=await api({accion:'CATALOGO',departamento:DEPARTAMENTO});
  catalogo=Array.isArray(data.articulos)?data.articulos:[];
  renderCatalogo();
  setStatus('Conectado','ok');
 }catch(error){
  console.error(error);
  $('catalog').innerHTML='<div class="empty">No se pudo cargar el catálogo.<br>'+escapeHtml(error.message)+'</div>';
  setStatus('Error de conexión','error');
 }
}

function renderCatalogo(){
 const q=$('search').value.trim().toLowerCase();
 const items=catalogo.filter(a=>
  String(a.referencia||'').toLowerCase().includes(q)||
  String(a.idArticulo||'').toLowerCase().includes(q)||
  String(a.claveArticulo||'').toLowerCase().includes(q)||
  String(a.categoria||'').toLowerCase().includes(q)
 );
 $('count').textContent=catalogo.length+(catalogo.length===1?' artículo':' artículos');
 if(!items.length){$('catalog').innerHTML='<div class="empty">No hay artículos que coincidan.</div>';return;}
 $('catalog').innerHTML=items.map(a=>{
  const key=String(a.claveArticulo||''); const current=pedido.get(key); const qty=current?current.cantidad:0;
  return `<div class="item"><div><div class="item-name">${escapeHtml(a.referencia||key)}</div><div class="item-meta">${escapeHtml(a.categoria||'')} · ${escapeHtml(a.idArticulo||'')}</div></div><div class="qty"><button type="button" onclick="changeQty('${escapeAttr(key)}',-1)">−</button><input type="number" min="0" step="1" value="${qty}" onchange="setQty('${escapeAttr(key)}',this.value)"><button type="button" onclick="changeQty('${escapeAttr(key)}',1)">+</button></div></div>`;
 }).join('');
}

function changeQty(key,delta){const current=pedido.get(key);setQty(key,Math.max(0,(current?current.cantidad:0)+delta));}
function setQty(key,value){
 const qty=Math.floor(Number(value)||0);
 if(qty<=0) pedido.delete(key);
 else{const articulo=catalogo.find(a=>String(a.claveArticulo||'')===key);if(!articulo)return;pedido.set(key,{articulo,cantidad:qty,comentario:pedido.get(key)?.comentario||''});}
 renderCatalogo();renderPedido();
}
function actualizarComentario(key,value){const linea=pedido.get(key);if(linea)linea.comentario=value;}
function renderPedido(){
 const lineas=[...pedido.values()]; const total=lineas.reduce((sum,x)=>sum+x.cantidad,0);
 $('lines').textContent=lineas.length+(lineas.length===1?' línea':' líneas');$('total').textContent=total;$('send').disabled=lineas.length===0;
 if(!lineas.length){$('order').innerHTML='<div class="empty">Todavía no has añadido ningún artículo.</div>';return;}
 $('order').innerHTML=lineas.map(x=>{const key=String(x.articulo.claveArticulo||'');return `<div class="order-line"><div class="order-line-top"><span>${escapeHtml(x.articulo.referencia||key)}</span><span>x ${x.cantidad}</span></div><div class="order-line-meta">${escapeHtml(x.articulo.categoria||'')} · ${escapeHtml(x.articulo.idArticulo||'')}</div><label class="comment-label">Comentario para este artículo (opcional)</label><textarea placeholder="Escribe aquí una indicación..." oninput="actualizarComentario('${escapeAttr(key)}',this.value)">${escapeHtml(x.comentario)}</textarea></div>`;}).join('');
}

async function enviarPedido(){
 const lineas=[...pedido.values()].map(x=>({claveArticulo:x.articulo.claveArticulo,cantidad:x.cantidad,comentario:x.comentario||''}));
 if(!lineas.length)return;
 $('send').disabled=true;$('send').textContent='ENVIANDO...';showNotice('','');
 try{
  const data=await api({accion:'CREAR_PEDIDO',departamento:DEPARTAMENTO,lineas});
  showNotice('Pedido enviado correctamente. Nº de pedido: '+data.pedidoId,'ok');
  pedido.clear();renderCatalogo();renderPedido();
  await cargarPedidosSnack();
 }catch(error){console.error(error);showNotice(error.message,'error');}
 finally{$('send').textContent='ENVIAR PEDIDO';$('send').disabled=pedido.size===0;}
}

async function cargarPedidosSnack(){
 try{
  const data=await api({accion:'PEDIDOS_DEPARTAMENTO',departamento:DEPARTAMENTO});
  pedidosSnack=Array.isArray(data.pedidos)?data.pedidos:[];
  await renderPedidosSnack();
 }catch(error){
  console.error(error);
  $('historyBody').innerHTML='<div class="empty">No se pudieron cargar los pedidos.<br>'+escapeHtml(error.message)+'</div>';
 }
}

async function renderPedidosSnack(){
 if(!pedidosSnack.length){$('historyBody').innerHTML='<div class="empty">Todavía no hay pedidos.</div>';return;}
 $('historyBody').innerHTML=pedidosSnack.map(p=>{
  const estado=String(p.estado||'').toUpperCase();
  const cls=estado==='VALIDADO'?'validated':'pending';
  return `<div class="history-row">
   <div class="history-top"><span>${escapeHtml(p.pedidoId)}</span><span class="badge ${cls}">${escapeHtml(estado||'PENDIENTE')}</span></div>
   <div class="history-meta">${escapeHtml(formatFecha(p.fecha))} · ${escapeHtml(p.hora||'')} · Solicitado: ${Number(p.totalSolicitado)||0} · Servido: ${Number(p.totalServido)||0}</div>
   <button class="refresh" type="button" style="margin-top:10px" onclick="verDetalleSnack('${escapeAttr(p.pedidoId)}',this)">VER DETALLE</button>
   <div id="detail-${safeId(p.pedidoId)}" class="history-detail"></div>
  </div>`;
 }).join('');
}

async function verDetalleSnack(pedidoId,button){
 const box=$('detail-'+safeId(pedidoId));
 if(box.classList.contains('show')){box.classList.remove('show');button.textContent='VER DETALLE';return;}
 button.disabled=true;button.textContent='CARGANDO...';
 try{
  const data=await api({accion:'DETALLE_PEDIDO',pedidoId});
  const p=data.pedido||data;
  const lineas=Array.isArray(p.lineas)?p.lineas:[];
  box.innerHTML=lineas.length?lineas.map(l=>`
   <div class="detail-line">
    <strong>${escapeHtml(l.referencia||l.idArticulo||'Artículo')}</strong>
    <div>Solicitado: ${Number(l.cantidadSolicitada)||0} · Servido: ${Number(l.cantidadServida)||0}</div>
    ${l.comentario?`<div>Comentario del pedido: ${escapeHtml(l.comentario)}</div>`:''}
    ${l.comentarioValidacion?`<div>Respuesta del economato: ${escapeHtml(l.comentarioValidacion)}</div>`:''}
   </div>`).join(''):'<div>No hay líneas.</div>';
  box.classList.add('show');button.textContent='OCULTAR DETALLE';
 }catch(error){box.innerHTML='<div>'+escapeHtml(error.message)+'</div>';box.classList.add('show');button.textContent='OCULTAR DETALLE';}
 finally{button.disabled=false;}
}

function formatFecha(value){
 if(!value)return '';
 const s=String(value);
 if(s.includes('T'))return s.split('T')[0];
 return s;
}
function safeId(value){return String(value||'').replace(/[^a-zA-Z0-9_-]/g,'_');}
function showNotice(text,type){const n=$('notice');n.textContent=text;n.className='notice'+(text?' show '+type:'');}
function escapeHtml(value){return String(value??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#039;");}
function escapeAttr(value){return String(value??'').replaceAll('\\','\\\\').replaceAll("'","\\'");}

$('search').addEventListener('input',renderCatalogo);
$('send').addEventListener('click',enviarPedido);
$('refreshOrders').addEventListener('click',cargarPedidosSnack);

cargarCatalogo();
cargarPedidosSnack();
</script>
</body>
</html>
